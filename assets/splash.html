<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Linda Probe</title>
<style>
html,body{height:100%;margin:0;background:#0d0f15;overflow:hidden}
body{font:16px 'Segoe UI','Segoe UI Variable',system-ui,sans-serif}
#bg{position:fixed;inset:0;background:#0d0f15}
#bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease;border:0}
#bg img.vis{opacity:1}
#err{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);max-width:80%;background:rgba(13,15,21,.82);color:#e9ecf3;border:1px solid #3a4356;padding:10px 18px;font-size:14px;text-align:center}
#err[hidden]{display:none}
</style>
<div id="bg"><img id="im0" class="vis" alt=""><img id="im1" alt=""></div>
<div id="err" hidden></div>
<script>
'use strict';
/* Panorama splash: fullscreen cover, rotation of the 5 style gifs of the
   detected language (2_panorama first), crossfade, no external resources. */
var GIFS = {
  ru: ['splash/ru/2.gif', 'splash/ru/3.gif', 'splash/ru/4.gif', 'splash/ru/5.gif', 'splash/ru/1.gif'],
  en: ['splash/en/2.gif', 'splash/en/3.gif', 'splash/en/4.gif', 'splash/en/5.gif', 'splash/en/1.gif'],
  pl: ['splash/pl/2.gif', 'splash/pl/3.gif', 'splash/pl/4.gif', 'splash/pl/5.gif', 'splash/pl/1.gif']
};
/* Display order over style numbers 1..5: panorama (2) first, then circle. */
var ORDER = [2, 3, 4, 5, 1];
var ROTATE_MS = 3500;

function pickLang(tag) {
  var t = String(tag || '').toLowerCase().replace(/_/g, '-').slice(0, 2);
  return (t === 'ru' || t === 'en' || t === 'pl') ? t : 'ru';
}
function nextIndex(i, n) { return (i + 1) % n; }
/* Server /health "prewarm" vocab (idle|working|done|disabled) plus the
   splash title vocab (starting|warming|ready): both map to title stages. */
function stageTitle(s) {
  s = String(s || '');
  if (s === 'working' || s === 'warming') return 'warming';
  if (s === 'done' || s === 'ready' || s === 'disabled') return 'ready';
  return 'starting';
}
function baseUrl() {
  try {
    var q = new URLSearchParams(window.location.search).get('base');
    if (q) return String(q).replace(/\/+$/, '');
  } catch (e) { /* fall through to default */ }
  return 'http://127.0.0.1:8798';
}
function showError(msg) {
  try {
    var el = document.getElementById('err');
    el.textContent = String(msg || 'Server error');
    el.hidden = false;
  } catch (e) { /* never break rotation on DOM trouble */ }
}
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

var lang = pickLang(navigator.language || navigator.userLanguage || 'ru');
var frames = GIFS[lang] || GIFS.ru;
frames.forEach(function (src) { try { var im = new Image(); im.src = src; } catch (e) {} });
var REDUCED = (typeof matchMedia === 'function') &&
  matchMedia('(prefers-reduced-motion: reduce)').matches;

var imgs = [document.getElementById('im0'), document.getElementById('im1')];
var cur = 0, shown = 0;
try { imgs[0].src = frames[0]; } catch (e) {}
if (!REDUCED && frames.length > 1) {
  setInterval(function () {
    try {
      cur = nextIndex(cur, frames.length);
      var back = imgs[1 - shown], front = imgs[shown];
      back.src = frames[cur];
      back.classList.add('vis');
      front.classList.remove('vis');
      shown = 1 - shown;
    } catch (e) { /* keep current frame on DOM trouble */ }
  }, ROTATE_MS);
}

async function boot() {
  var base = baseUrl();
  for (;;) {
    try {
      var r = await fetch(base + '/ping', {mode: 'no-cors', cache: 'no-store'});
      if (r && (r.ok === true || r.type === 'opaque')) break;
    } catch (e) { /* server not up yet: keep waiting, no error shown */ }
    await sleep(250);
  }
  try {
    fetch(base + '/api/prewarm', {method: 'POST', mode: 'no-cors',
      headers: {'Content-Type': 'application/json'}, body: '{}'}).catch(function () {});
  } catch (e) { /* fire-and-forget */ }
  document.title = 'Linda Probe \u2014 starting';
  for (;;) {
    try {
      var h = await fetch(base + '/health', {cache: 'no-store'});
      if (h.status === 403) { await sleep(1000); continue; }
      var j = await h.json();
      if (!h.ok) { showError('Server error: HTTP ' + h.status); await sleep(2000); continue; }
      document.title = 'Linda Probe \u2014 ' + stageTitle(j && j.prewarm);
      if (j && (j.prewarm === 'done' || j.prewarm === 'ready' || j.prewarm === 'disabled')) break;
    } catch (e) { /* unreadable while starting: stay silent, keep frame */ }
    await sleep(1000);
  }
}
try { boot().catch(function () {}); } catch (e) {}
if (typeof window !== 'undefined' && window) {
  window.__splash = {GIFS: GIFS, ORDER: ORDER, ROTATE_MS: ROTATE_MS,
    pickLang: pickLang, stageTitle: stageTitle, nextIndex: nextIndex};
}
</script>
